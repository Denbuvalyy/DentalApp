name: CI/CD MAUI Android (.NET 10)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

  pull_request:
    branches:
      - develop
      - main
      - 'release/*'

  push:
    branches:
      - develop
      - main
      - 'release/*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =========================================
  # 🧪 CHECK PRs / MANUAL RUN
  # =========================================
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache .NET workloads
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: |
          dotnet workload install maui
          dotnet workload install android

      - name: Restore
        run: dotnet restore DentalApp.sln

      - name: Run tests
        run: |
          dotnet test DentalApp.Tests/DentalApp.Tests.csproj \
            -c Release \
            --no-restore

      - name: Build Android
        run: |
          dotnet build DentalApp/DentalApp.csproj \
            -c Release \
            -f net10.0-android \
            /p:ApplicationVersion=${{ github.run_number }}

  # =========================================
  # 📱 FIREBASE DISTRIBUTION
  # develop + release/*
  # =========================================
  firebase-distribution:
    if: |
      (
        github.event_name == 'push' &&
        (
          github.ref == 'refs/heads/develop' ||
          startsWith(github.ref, 'refs/heads/release/')
        )
      ) ||
      github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache .NET workloads
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: |
          dotnet workload install maui
          dotnet workload install android

      - name: Restore
        run: dotnet restore DentalApp.sln

      - name: Run tests
        run: |
          dotnet test DentalApp.Tests/DentalApp.Tests.csproj \
            -c Release \
            --no-restore

      - name: Build APK
        run: |
          dotnet build DentalApp/DentalApp.csproj \
            -c Release \
            -f net10.0-android \
            /p:ApplicationVersion=${{ github.run_number }} \
            /p:AndroidPackageFormat=apk

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          path: |
            **/bin/Release/net10.0-android/**/*.apk

      - name: Upload APK to Firebase App Distribution
        run: |
          firebase appdistribution:distribute \
            $(find DentalApp/bin/Release/net10.0-android/ -name "*.apk" | head -n 1) \
            --app ${{ secrets.FIREBASE_APP_ID }} \
            --groups "internal-testers" \
            --release-notes "
            Branch: ${{ github.ref_name }}
            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            "
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  # =========================================
  # 🚀 GOOGLE PLAY INTERNAL TESTING
  # ONLY release/*
  # =========================================
  google-play-internal:
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache .NET workloads
        uses: actions/cache@v4
        with:
          path: ~/.dotnet
          key: dotnet-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: |
          dotnet workload install maui
          dotnet workload install android

      - name: Restore
        run: dotnet restore DentalApp.sln

      - name: Run tests
        run: |
          dotnet test DentalApp.Tests/DentalApp.Tests.csproj \
            -c Release \
            --no-restore

      # 🔐 Decode keystore
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -D -o dentalapp.keystore

      # 📦 Build signed AAB
      - name: Build SIGNED AAB
        run: |
          dotnet publish DentalApp/DentalApp.csproj \
            -c Release \
            -f net10.0-android \
            /p:ApplicationVersion=${{ github.run_number }} \
            /p:AndroidKeyStore=true \
            /p:AndroidSigningKeyStore=$(pwd)/dentalapp.keystore \
            /p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }} \
            /p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }} \
            /p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }}

      # 🚀 Upload to Google Play Internal Testing
      - name: Upload to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dankoapps.dentalapp
          releaseFiles: DentalApp/bin/Release/net10.0-android/publish/*-Signed.aab
          tracks: internal
          status: completed

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.run_number }}
          path: |
            **/bin/Release/net10.0-android/**/*.aab  