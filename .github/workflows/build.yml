name: Build MAUI Android (.NET 10)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-android:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          include-prerelease: true

      - name: Install MAUI workload
        run: |
          dotnet workload install maui
          dotnet workload install android

      - name: Restore dependencies
        run: dotnet restore DentalApp.sln

      - name: Run tests
        run: dotnet test DentalApp.Tests/DentalApp.Tests.csproj -c Release --no-restore

      # 🔑 Decode keystore
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > dentalapp.keystore || \
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > dentalapp.keystore

      # 📦 Build SIGNED AAB
      - name: Build signed Android AAB
        run: |
          dotnet publish DentalApp/DentalApp.csproj \
            -c Release \
            -f net10.0-android \
            /p:AndroidKeyStore=true \
            /p:AndroidSigningKeyStore=dentalapp.keystore \
            /p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }} \
            /p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }} \
            /p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }}

      # 🚀 Upload artifact
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-build
          path: |
            **/bin/Release/net10.0-android/**/*.aab