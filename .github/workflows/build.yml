name: Build MAUI Android (.NET 10)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          include-prerelease: true

      - name: Install MAUI workload
        run: |
          dotnet workload install maui
          dotnet workload install android

      - name: Restore
        run: dotnet restore DentalApp.sln

      - name: Run tests
        run: dotnet test DentalApp.Tests/DentalApp.Tests.csproj -c Release --no-restore

      # 🔹 PR build (без підпису)
      - name: Build (PR - unsigned)
        if: github.event_name == 'pull_request'
        run: dotnet publish DentalApp/DentalApp.csproj -c Release -f net10.0-android

      # 🔹 Decode keystore тільки для push
      - name: Decode keystore
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -D -o dentalapp.keystore

          echo "Files:"
          ls -la

          echo "Keystore size:"
          stat -f%z dentalapp.keystore

      # 🔹 Signed build тільки після merge
      - name: Build signed AAB
        if: github.event_name == 'push'
        run: |
          dotnet publish DentalApp/DentalApp.csproj \
            -c Release \
            -f net10.0-android \
            /p:AndroidKeyStore=true \
            /p:AndroidSigningKeyStore=$(pwd)/dentalapp.keystore \
            /p:AndroidSigningStorePass=${{ secrets.KEYSTORE_PASSWORD }} \
            /p:AndroidSigningKeyAlias=${{ secrets.KEY_ALIAS }} \
            /p:AndroidSigningKeyPass=${{ secrets.KEY_PASSWORD }}

      # 🔹 Artifact тільки для релізу
      - name: Upload AAB
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-build
          path: |
            **/bin/Release/net10.0-android/**/*.aab